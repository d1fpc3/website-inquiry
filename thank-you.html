<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Got It! — Talk Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --accent: #7C6DFA;
  --accent-light: #A99EFC;
  --black: #0A0A0F;
  --black-2: #111118;
  --white: #F0EEFF;
  --gray: #888;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--black);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(124,109,250,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(124,109,250,0.08) 0%, transparent 50%);
  pointer-events: none;
}
.card {
  position: relative;
  text-align: center;
  max-width: 480px;
  background: var(--black-2);
  border: 1px solid rgba(124,109,250,0.15);
  padding: 4rem 3rem;
  animation: fadeUp 0.7s both;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 2rem; right: 2rem;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.check {
  width: 56px; height: 56px;
  border: 1px solid rgba(124,109,250,0.4);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 2rem;
  font-size: 1.4rem;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3rem;
  font-weight: 300;
  line-height: 1.1;
  margin-bottom: 0.2em;
}
h1 em { font-style: italic; color: var(--accent-light); font-weight: 600; }
.divider {
  width: 50px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 1.5rem auto;
}
p {
  font-size: 0.82rem;
  line-height: 1.9;
  color: rgba(240,238,255,0.55);
  margin-bottom: 2.5rem;
}
.back-btn {
  display: inline-block;
  padding: 0.85rem 2rem;
  background: var(--accent);
  color: var(--white);
  text-decoration: none;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  transition: background 0.3s;
}
.back-btn:hover { background: var(--accent-light); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>Message<br/><em>Received!</em></h1>
  <div class="divider"></div>
  <p>Thanks for reaching out — I'll review your project details and get back to you within 24 hours.</p>
  <a href="index.html" class="back-btn">Back to Form</a>
</div>
</body>
</html>
